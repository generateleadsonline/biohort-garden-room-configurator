[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"
[build.environment]
  NODE_VERSION = "22"
[functions]
  node_bundler = "esbuild"
[[redirects]]
  from = "/"
  to = "/configurator/"
  status = 302
[[redirects]]
  from = "/configurator/*"
  to = "/index.html"
  status = 200
